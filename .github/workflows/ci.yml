name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build application
        run: npm run build

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure

      - name: Initialize bootstrap Terraform
        working-directory: infrastructure/bootstrap/state
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap Terraform
        working-directory: infrastructure/bootstrap/state
        run: terraform validate

      - name: Initialize DEV Terraform
        working-directory: infrastructure/environments/dev
        run: terraform init -backend=false -input=false

      - name: Validate DEV Terraform
        working-directory: infrastructure/environments/dev
        run: terraform validate

      - name: Initialize PROD Terraform
        working-directory: infrastructure/environments/prod
        run: terraform init -backend=false -input=false

      - name: Validate PROD Terraform
        working-directory: infrastructure/environments/prod
        run: terraform validate
